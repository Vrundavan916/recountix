name: Security checks

on:
  pull_request:
  push:
    branches: [main, "security/**"]

permissions:
  contents: read

jobs:
  static-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check frontend/js/auth.js
          node --check frontend/js/db.js
          node --check frontend/js/app.js
          node --check frontend/js/company.js
          node --check frontend/js/excel-import.js
      - name: Security regression scan
        run: node scripts/security-check.mjs
